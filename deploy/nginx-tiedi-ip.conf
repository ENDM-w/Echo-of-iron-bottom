# Temporary HTTP-only entry point for a server without a domain.
# Use only for testing with disposable credentials; HTTP exposes credentials in transit.
# Install after adding deploy/nginx-tiedi-http.conf's limit_req_zone to nginx http {}.

server {
    listen 80 default_server;
    server_name _;

    location = /tiedi {
        return 301 /tiedi/;
    }

    location = /tiedi/platform/auth/login {
        limit_req zone=tiedi_login burst=5 nodelay;
        limit_req_status 429;
        rewrite ^/tiedi(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # 同上：存档含历史快照，需容纳 10MB 以上的导入请求。
        client_max_body_size 32m;
    }

    location /tiedi/ {
        rewrite ^/tiedi(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        # 同上：存档含历史快照，需容纳 10MB 以上的导入请求。
        client_max_body_size 32m;
    }
}
